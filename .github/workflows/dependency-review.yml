name: Dependency review
on:
  workflow_dispatch:
    inputs:
      base:
        description: Base commit for dependency comparison
        type: string
        required: true
      head:
        description: Head commit for dependency comparison
        type: string
        required: true
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec
        with:
          base-ref: ${{ inputs.base }}
          head-ref: ${{ inputs.head }}
