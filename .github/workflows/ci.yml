name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p forge-core -p forge-cli --all-targets -- -D warnings
      - run: cargo test --locked -p forge-core -p forge-cli -- --test-threads=2
        timeout-minutes: 8
      - run: cargo build --locked -p forge-cli --release
      - run: python scripts/check-text.py
      - run: python scripts/verify-collections.py
      - name: Prepare hosted-only private transport prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openssh-server
        timeout-minutes: 3
      - name: Verify real isolated authenticated HTTPS and pinned-agent SSH acquisition
        if: runner.os == 'Linux'
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT
          timeout --signal=TERM --kill-after=10s 180s
          unshare --mount --net --pid --fork --mount-proc --kill-child
          python3 -B scripts/verify-source-transport.py
          --application target/release/numera-forge --work .ci-work/transport
        timeout-minutes: 4
      - name: Preserve sanitized private transport diagnostics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: transport-diagnostics
          path: .ci-work/transport/*.log
          if-no-files-found: warn
      - name: Build pinned official SDK acceptance image
        if: runner.os == 'Linux'
        run: >-
          timeout --signal=TERM --kill-after=10s 300s
          docker build --platform=linux/amd64 --progress=plain
          --file scripts/host-activation.Dockerfile --tag forge-host-activation:ci scripts
        timeout-minutes: 6
      - name: Verify isolated original non-model callback and skill consumption
        if: runner.os == 'Linux'
        run: >-
          timeout --signal=TERM --kill-after=10s 150s
          python3 -I scripts/verify-host-activation.py
          --image forge-host-activation:ci --work .ci-work/host-activation
        timeout-minutes: 3
      - name: Preserve sanitized host activation evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: host-activation-diagnostics
          path: |
            .ci-work/host-activation/*.log
            .ci-work/host-activation/result.json
          if-no-files-found: warn
      - name: Verify launcher and raw-mode publication contracts
        shell: pwsh
        timeout-minutes: 3
        run: |
          & ./scripts/check-launchers.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify launcher from another working directory
        shell: pwsh
        run: |
          Set-Location scripts
          & ../run.ps1 -Verify
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cli-${{ matrix.os }}
          path: |
            target/release/numera-forge
            target/release/numera-forge.exe
          if-no-files-found: error
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npm ci --prefix apps/desktop --ignore-scripts
      - run: npm --prefix apps/desktop run build
      - run: npx --prefix apps/desktop playwright install --with-deps chromium
      - run: npm --prefix apps/desktop run test:ui
        timeout-minutes: 5
