name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p forge-core -p forge-cli -p forge-ci-input --all-targets -- -D warnings
      - run: cargo test --locked -p forge-ci-input -- --test-threads=2
        timeout-minutes: 2
      - run: cargo test --locked -p forge-core -p forge-cli -- --test-threads=2
        if: runner.os != 'Linux'
        timeout-minutes: 8
      - run: cargo build --locked -p forge-cli --release
        if: runner.os != 'Linux'
      - name: Prepare controlled input supervisor
        if: runner.os == 'Linux'
        run: cargo build --locked -p forge-ci-input --release
        timeout-minutes: 5
      - name: Verify controlled Linux Core and frontend inputs
        if: runner.os == 'Linux'
        run: timeout --signal=TERM --kill-after=30s 1500s bash scripts/ci-input.sh
        timeout-minutes: 26
      - name: Preserve sanitized controlled input evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: controlled-input-evidence
          path: |
            .ci-work/controlled-input/run-*/*/result.json
            .ci-work/controlled-input/run-*/negative/*/result.json
            .ci-work/controlled-input/run-*/*/forge-ci-input_*.log
            .ci-work/controlled-input/run-*/negative/*/forge-ci-input_*.log
          retention-days: 7
          if-no-files-found: error
      - run: python scripts/check-text.py
      - run: python scripts/verify-collections.py
      - name: Verify real release CLI originals and safe update lifecycle
        if: runner.os == 'Linux'
        run: >-
          timeout --signal=TERM --kill-after=10s 210s
          python3 -B scripts/verify-cli-lifecycle.py
          --application target/release/numera-forge --work .ci-work/cli-lifecycle
        timeout-minutes: 4
      - name: Preserve practical CLI evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cli-lifecycle-evidence
          path: |
            .ci-work/cli-lifecycle/*.log
            .ci-work/cli-lifecycle/result.json
          retention-days: 7
          if-no-files-found: error
      - name: Prepare hosted-only private transport prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openssh-server
        timeout-minutes: 3
      - name: Verify real isolated authenticated HTTPS and pinned-agent SSH acquisition
        if: runner.os == 'Linux'
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT
          timeout --signal=TERM --kill-after=10s 180s
          unshare --mount --net --pid --fork --mount-proc --kill-child
          python3 -B scripts/verify-source-transport.py
          --application target/release/numera-forge --work .ci-work/transport
        timeout-minutes: 4
      - name: Preserve sanitized private transport diagnostics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: transport-diagnostics
          path: .ci-work/transport/*.log
          if-no-files-found: warn
      - name: Build pinned official SDK acceptance image
        if: runner.os == 'Linux'
        run: >-
          timeout --signal=TERM --kill-after=10s 300s
          docker build --platform=linux/amd64 --progress=plain
          --file scripts/host-activation.Dockerfile --tag forge-host-activation:ci scripts
        timeout-minutes: 6
      - name: Verify isolated original non-model callback and skill consumption
        if: runner.os == 'Linux'
        run: >-
          timeout --signal=TERM --kill-after=10s 150s
          python3 -I scripts/verify-host-activation.py
          --image forge-host-activation:ci --work .ci-work/host-activation
        timeout-minutes: 3
      - name: Preserve sanitized host activation evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: host-activation-diagnostics
          path: |
            .ci-work/host-activation/*.log
            .ci-work/host-activation/result.json
          if-no-files-found: warn
      - name: Verify launcher and raw-mode publication contracts
        shell: pwsh
        timeout-minutes: 3
        run: |
          & ./scripts/check-launchers.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify launcher from another working directory
        shell: pwsh
        run: |
          Set-Location scripts
          & ../run.ps1 -Verify
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cli-${{ matrix.os }}
          path: |
            target/release/numera-forge
            target/release/numera-forge.exe
          if-no-files-found: error
