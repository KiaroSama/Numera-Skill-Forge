name: Native desktop build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.99.0
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf webkit2gtk-driver xvfb
        timeout-minutes: 5
      - run: npm ci --prefix apps/desktop --ignore-scripts
      - name: Build native unsigned bundle
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            npm --prefix apps/desktop run tauri -- build --bundles app
          else
            npm --prefix apps/desktop run tauri -- build
          fi
        timeout-minutes: 30
      - name: Install project-local native test driver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version 2.1.0 --locked --root "$GITHUB_WORKSPACE/.ci-work/native-tools"
        timeout-minutes: 10
      - name: Verify actual native startup and service IPC
        if: runner.os == 'Linux'
        run: timeout --signal=TERM --kill-after=10s 150s xvfb-run --auto-servernum python3 scripts/native-desktop-smoke.py --application target/release/numera-forge-desktop --driver .ci-work/native-tools/bin/tauri-driver --work .ci-work/native-smoke
        timeout-minutes: 3
      - name: Preserve native smoke diagnostics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-smoke-diagnostics-${{ matrix.os }}
          path: .ci-work/native-smoke/*.log
          if-no-files-found: warn
      - name: Install project-local Windows native test driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install tauri-driver --version 2.1.0 --locked --root "$env:GITHUB_WORKSPACE/.ci-work/native-tools"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        timeout-minutes: 10
      - name: Verify Windows release DOM and real service IPC on private desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/native-windows-smoke.py --application target/release/numera-forge-desktop.exe --driver .ci-work/native-tools/bin/tauri-driver.exe --work .ci-work/native-windows-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        timeout-minutes: 6
      - name: Preserve Windows native smoke diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-smoke-diagnostics-${{ matrix.os }}
          path: .ci-work/native-windows-smoke/**/*.log
          if-no-files-found: warn
      - name: Record unsigned checksums and locked dependency provenance
        shell: bash
        run: python scripts/distribution-manifest.py --bundle target/release/bundle --runner '${{ matrix.os }}'
        timeout-minutes: 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unsigned-desktop-${{ matrix.os }}
          path: target/release/bundle/**
          if-no-files-found: error
