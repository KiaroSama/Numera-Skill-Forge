name: Synchronize collections
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: collection-publication
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - name: Build trusted Forge CLI only
        run: cargo build --locked -p forge-cli --release
        timeout-minutes: 15
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collection-cli
          path: target/release/numera-forge
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: collection-cli
          path: target/release
      - name: Restore trusted binary execution mode
        run: chmod 755 target/release/numera-forge
      - name: Synchronize accepted safe content
        id: sync
        shell: pwsh
        timeout-minutes: 12
        run: |
          & ./run.ps1 -Apply
          $code = $LASTEXITCODE
          "exit_code=$code" >> $env:GITHUB_OUTPUT
          if ($code -notin @(0, 2)) { exit $code }
          if ($code -eq 2) {
            "### Collection review needed`nHealthy accepted deltas may still publish; pending or failed entries retain their prior output." >> $env:GITHUB_STEP_SUMMARY
          }
          exit 0
      - name: Validate and publish exact generated paths
        shell: pwsh
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
          PUBLICATION_BRANCH: ${{ github.event.repository.default_branch }}
          PUBLICATION_REPOSITORY: ${{ github.repository }}
        run: |
          & ./scripts/publish-collections.ps1 -Publish -ExpectedHead $env:EXPECTED_HEAD -Branch $env:PUBLICATION_BRANCH -Repository $env:PUBLICATION_REPOSITORY
          exit $LASTEXITCODE
      - name: Preserve partial synchronization exit
        if: always() && steps.sync.outputs.exit_code == '2'
        shell: pwsh
        run: |
          "### Partial result`nCollection synchronization exited 2. Review required; this run is not fully successful." >> $env:GITHUB_STEP_SUMMARY
          exit 2
