[workspace]
members = ["crates/forge-core", "crates/forge-cli", "crates/forge-ci-input", "apps/desktop/src-tauri"]
default-members = ["crates/forge-core", "crates/forge-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.99"
repository = "https://github.com/KiaroSama/Numera-Skill-Forge"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
directories = "6"
toml = "1.1"
